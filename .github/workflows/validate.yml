name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifests (JSON, names, MCP URL, skills)
        run: python3 scripts/check_manifests.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate --strict
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
